<!DOCTYPE html>
<html>
<head>
    <title>Players</title>
</head>
<body>

    <h1>Players</h1>

    {% for player in players %}

        <div>
            <h3>{{ player.name }}</h3>
            <p>Age: {{ player.age }}</p>
            <p>Position: {{ player.position }}</p>
            <a href="/edit-player/{{player.id}}">Edit</a>
            <a href="/delete-player/{{player.id}}">Delete</a>
        </div>

        <hr>

    {% endfor %}

</body>
</html>
