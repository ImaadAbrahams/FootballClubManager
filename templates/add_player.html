<!DOCTYPE html>
<html>
<head>
    <title>Add Player</title>
</head>
<body>

    <h1>Add Player</h1>

    <form method="POST">

        <label>Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Age:</label><br>

        <button type="submit">Add Player</button>

    </form>

</body>
</html>
