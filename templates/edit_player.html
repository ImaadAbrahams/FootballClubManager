<!DOCTYPE html>
<html>

<head>
    <title>Edit Player</title>
</head>

<body>

    <h1>Edit Player</h1>

    <form method="POST">

        <label>Name:</label><br>

        <input
            type="text"
            name="name"
            value="{{ player.name }}"
        ><br><br>

        <label>Age:</label><br>

        <input
            type="number"
            name="age"
            value="{{ player.age }}"
        ><br><br>

        <label>Position:</label><br>

        <input
            type="text"
            name="position"
            value="{{ player.position }}"
        ><br><br>

        <button type="submit">
            Update Player
        </button>

    </form>

</body>

</html>
