{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1>Players</h1>

    <a href="/add-player" class="btn btn-success">
        Add Player
    </a>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <table class="table table-hover">

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Position</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

                {% for player in players %}

                <tr>

                    <td>{{ player.name }}</td>

                    <td>{{ player.age }}</td>

                    <td>{{ player.position }}</td>

                    <td>

                        <a
                            href="/edit-player/{{ player.id }}"
                            class="btn btn-primary btn-sm">
                            Edit
                        </a>

                        <a
                            href="/delete-player/{{ player.id }}"
                            class="btn btn-danger btn-sm">
                            Delete
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
