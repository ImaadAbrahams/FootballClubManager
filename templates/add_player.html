{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <h1 class="mb-4">
            Add Player
        </h1>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Position
                </label>

                <input
                    type="text"
                    name="position"
                    class="form-control"
                    required>

            </div>

            <button type="submit" class="btn btn-success">
                Add Player
            </button>

        </form>

    </div>

</div>

{% endblock %}
